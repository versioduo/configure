<!DOCTYPE html>
<html lang="en">
  <head>
    <title>V2 configure</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta name="name" content="configure">
    <meta name="description" content="MIDI Device Configuration">
    <meta name="version" content="491">
    <meta name="revised" content="2026-08-08">
    <meta name="copyright" content="Anyone can use this public domain work without having to seek authorisation, no one can ever own it.">
    <meta name="rating" content="safe for kids">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/logo-black.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" href="icons/logo.svg" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json">
    <link rel="source" href="https://github.com/versioduo/configure">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav>
      <h1>
        <a href="#">V2 configure</a>
      </h1>
      <details>
        <summary></summary>
        <ul onclick="parentNode.open = false">
        </ul>
      </details>
    </nav>
    <main class="--grid"></main>
    <script src="js/V2App.js"></script>
    <script src="js/V2Configuration.js"></script>
    <script src="js/V2Connection.js"></script>
    <script src="js/V2Debug.js"></script>
    <script src="js/V2Device.js"></script>
    <script src="js/V2Input.js"></script>
    <script src="js/V2Log.js"></script>
    <script src="js/V2MIDI.js"></script>
    <script src="js/V2MIDISelect.js"></script>
    <script src="js/V2Output.js"></script>
    <script src="js/V2Keyboard.js"></script>
    <script src="js/V2Settings.js"></script>
    <script>
      'use strict';

      try {
        new V2App((app) => {
          app.device = null;
          Object.seal(app);

          // WebUSB exports the link to this site with the USB device name to connect to.
          const connect = app.url.searchParams.get('connect');
          if (connect) {
            // Remove the command, it is only used for the first connection.
            app.url.searchParams.delete('connect');
            window.history.pushState({}, '', app.url);
          }

          // Early log init, but added as last section. We don't have a device but we already log messages.
          app.addSection(V2Log, [], (log) => {
            app.device = new V2Device(app, log, connect);

            app.addSection(V2Configuration);
            app.addSection(V2Input);
            app.addSection(V2Output);
            if (app.url.searchParams.get('debug'))
              app.addSection(V2Debug);
          });

          app.serviceWorker('service-worker.js');
        });
      } catch (error) {
        console.error(error);
        window.alert(error);
      }
    </script>
  </body>
</html>
